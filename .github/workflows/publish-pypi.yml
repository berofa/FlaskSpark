name: Publish To PyPI

# A release is a version tag (vX.Y.Z) pushed to GitLab and mirrored here. Every push of such a tag starts this
# workflow, also when a tag is pushed again (e.g. after a history rewrite); a version that is already on PyPI is
# skipped then, because PyPI never replaces a published file. Afterwards the tag gets a GitHub release with its
# section of CHANGELOG.md as notes (the mirror carries tags, not releases), unless it has one already.
# Run by hand (Actions → Run workflow) for a tag that is already published, it adds the missing GitHub release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag, e.g. v1.0.0"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      # The release notes come from the workflow's own commit (run by hand: main), so an older tag gets them too.
      - name: Checkout the release notes script
        uses: actions/checkout@v5
        with:
          path: tools
          sparse-checkout: |
            scripts
            CHANGELOG.md

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag against the version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the version in pyproject.toml ($version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sf "https://pypi.org/pypi/FlaskSpark/$version/json" > /dev/null; then
            echo "::notice::FlaskSpark $version is already on PyPI (tag pushed again?); nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.version.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Publish package to PyPI
        if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::The release $TAG exists already."
            exit 0
          fi
          python tools/scripts/release_notes.py "$VERSION" > release-notes.md
          gh release create "$TAG" --verify-tag --title "FlaskSpark $VERSION" --notes-file release-notes.md
