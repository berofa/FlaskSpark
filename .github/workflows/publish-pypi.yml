name: Publish To PyPI

# A release is a version tag (vX.Y.Z) pushed to GitLab and mirrored here. Every push of such a tag starts this
# workflow, also when a tag is pushed again (e.g. after a history rewrite); a version that is already on PyPI is
# skipped then, because PyPI never replaces a published file.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag against the version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($version)."
            exit 1
          fi
          if curl -sf "https://pypi.org/pypi/FlaskSpark/$version/json" > /dev/null; then
            echo "::notice::FlaskSpark $version is already on PyPI (tag pushed again?); nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.version.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Publish package to PyPI
        if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
