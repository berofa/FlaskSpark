# Extraction of the texts of flaskspark.core (scripts/core-i18n). Paths are relative to flaskspark/core.
[extractors]
flaskspark_js = flaskspark.core.i18n_extract:extract_js

[ignore: web/static/flaskspark/vendor/**]

[python: **.py]

[jinja2: web/templates/**.html]

# Template literals included (Babel's own JavaScript extractor loses calls in them).
[flaskspark_js: web/static/flaskspark/js/**.js]
